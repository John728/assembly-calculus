suite_name: mnist-ac-canonical-time
output_dir: results/mnist/canonical_time
seeds: [42, 43, 44, 45, 46]

conditions:
  - list_type: MNIST
    N: 10
    num_train_lists: 50000
    num_test_lists: 500
    k_train_min: 1
    k_train_max: 1
    k_test_min: 0
    k_test_max: 100

models:
  MNIST_AC:
    - model_name: MNIST-AC-Canonical-Held
      data_dir: data/mnist
      encoder_type: raw
      raw_k: 200
      train_limit: 50000
      test_limit: 500
      t_values: [0, 1, 2, 4, 8, 10, 20, 40, 100]
      n: 2000
      k: 200
      p: 0.1
      beta: 1.0
      presentation_rounds: 100
      settle_steps: 1
      class_organized: true
      stimulus_mode: held
      normalization_on: true
    - model_name: MNIST-AC-Canonical-Transient
      data_dir: data/mnist
      encoder_type: raw
      raw_k: 200
      train_limit: 50000
      test_limit: 500
      t_values: [0, 1, 2, 4, 8, 10, 20, 40, 100]
      n: 2000
      k: 200
      p: 0.1
      beta: 1.0
      presentation_rounds: 100
      settle_steps: 1
      class_organized: true
      stimulus_mode: transient
      normalization_on: true
