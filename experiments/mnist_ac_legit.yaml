suite_name: mnist-ac-legit
output_dir: results/mnist
seeds: [42, 43, 44, 45, 46]
conditions:
  - list_type: MNIST
    N: 10
    num_train_lists: 1000
    num_test_lists: 500
    k_train_min: 1
    k_train_max: 1
    k_test_min: 0
    k_test_max: 20
models:
  MNIST_AC:
    - model_name: MNIST-AC-Dense
      data_dir: data/mnist
      encoder_type: raw
      raw_k: 200
      train_limit: 1000
      test_limit: 500
      t_values: [0, 1, 2, 4, 8]
      n: 2000
      k: 200
      p: 1.0
      beta: 1.0
      presentation_rounds: 100
      settle_steps: 1
      class_organized: true
      stimulus_mode: held
