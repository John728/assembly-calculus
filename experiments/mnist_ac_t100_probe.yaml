suite_name: mnist-ac-t100-probe
output_dir: results/mnist/probes/t100_held
seeds: [42]
conditions:
  - list_type: MNIST
    N: 10
    num_train_lists: 50000
    num_test_lists: 200
    k_train_min: 1
    k_train_max: 1
    k_test_min: 0
    k_test_max: 100
models:
  MNIST_AC:
    - model_name: MNIST-AC-Tuned-Held-t100-Probe
      data_dir: data/mnist
      encoder_type: raw
      raw_k: 200
      train_limit: 50000
      test_limit: 200
      t_values: [0, 1, 2, 4, 8, 10, 20, 40, 60, 80, 100]
      n: 2000
      k: 200
      p: 0.1
      beta: 1.0
      presentation_rounds: 100
      settle_steps: 1
      class_organized: true
      stimulus_mode: held
