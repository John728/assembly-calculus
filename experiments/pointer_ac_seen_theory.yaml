suite_name: pointer-ac-seen-theory
output_dir: results/pointer/seen_theory
seeds: [42, 43, 44]

conditions:
  - list_type: Seen
    N: 10
    num_train_lists: 10
    num_test_lists: 0
    k_train_min: 1
    k_train_max: 6
    k_test_min: 1
    k_test_max: 6

models:
  AC:
    - model_name: Pointer-AC-Seen-Theory
      assembly_size: 16
      density: 0.35
      plasticity: 0.25
      presentation_rounds: 4
      settle_steps: 1
      transition_rounds: 12
      association_steps: 3
      samples_per_list_eval: 20
      time_budgets: [0, 1, 2, 3, 4, 6, 8, 10]
      theory_pointer: true
