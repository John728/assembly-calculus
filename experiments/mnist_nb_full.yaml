suite_name: mnist-nb
output_dir: results/mnist
seeds: [42, 43, 44, 45, 46]
conditions:
  - list_type: MNIST
    N: 10
    num_train_lists: 50000
    num_test_lists: 500
    k_train_min: 1
    k_train_max: 1
    k_test_min: 0
    k_test_max: 10
models:
  MNIST_NB:
    - model_name: MNIST-NB-Held
      data_dir: data/mnist
      t_max: 10
      train_limit: 5000
      test_limit: 500
      n_neurons: 2000
      cap_size: 200
      sparsity: 0.1
      beta: 1.0
      n_rounds: 5
      recurrent: true
      stimulus_mode: held

    - model_name: MNIST-NB-CueOnly
      data_dir: data/mnist
      t_max: 10
      train_limit: 5000
      test_limit: 500
      n_neurons: 2000
      cap_size: 200
      sparsity: 0.1
      beta: 1.0
      n_rounds: 5
      recurrent: true
      stimulus_mode: cue_only

    - model_name: MNIST-NB-NoRecurrent
      data_dir: data/mnist
      t_max: 10
      train_limit: 5000
      test_limit: 500
      n_neurons: 2000
      cap_size: 200
      sparsity: 0.1
      beta: 1.0
      n_rounds: 5
      recurrent: false
      stimulus_mode: held
